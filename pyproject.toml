[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photonpairlab"
version = "0.1.0"
description = "PhotonPairLab is a Python-based simulation toolkit for modeling the generation of photon pairs via spontaneous parametric down-conversion (SPDC) in nonlinear crystals. This project is designed with a clean, modular, and object-oriented architecture, making it extensible for further development or integration into larger quantum optics simulations."
authors = [{name="Nico Sieber", email="nico.sieber@gmx.net"}]
requires-python = ">=3.12"
dependencies = [
    "ipykernel",
    "numpy",
    "scipy",
    "matplotlib",
    "pillow>=12.3.0"
]
[project.urls]
LinkedIn = "https://www.linkedin.com/in/nico-sieber-0a7204156"

[tool.mypy]
namespace_packages = true
mypy_path = "src"

[tool.isort]
profile = "black"

[tool.black]
line-length = 150
target-version = ["py312"]

[tool.flake8]
max-line-length = 150
extend-ignore = ["F541"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]

[tool.uv]
config-settings = { editable_mode = "compat" }